name: QQQ Daily Signal Check

on:
  # 매일 자동 실행 (뉴욕 시간 오후 4:30 = UTC 21:30)
  # schedule:
  #   - cron: '30 21 * * 1-5'  # 월-금, UTC 21:30 (뉴욕 4:30 PM)
  
  # 수동 실행도 가능
  workflow_dispatch:

jobs:
  check-signals:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run signal check
      id: signal_check
      run: python scripts/daily_check.py
    
    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: |
          ${{ steps.signal_check.outputs.action == 'buy' && '🟢 QQQ 매수!' || 
              steps.signal_check.outputs.action == 'add' && '🔵 QQQ 물타기!' ||
              steps.signal_check.outputs.action == 'sell' && '💰 QQQ 익절!' || 
              steps.signal_check.outputs.signal_type == 'buy' && '📡 QQQ 매수 시그널' ||
              steps.signal_check.outputs.signal_type == 'sell' && '📡 QQQ 매도 시그널 (액션 없음)' ||
              '📊 QQQ 시그널 없음' }} (${{ steps.signal_check.outputs.current_date }})
        to: ${{ secrets.EMAIL_TO }}
        from: Auto-Stock QQQ <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ═══════════════════════════════════════
          📊 QQQ 일일 리포트
          ═══════════════════════════════════════

          📅 날짜: ${{ steps.signal_check.outputs.current_date }}

          💰 가격 정보
          ─────────────────────────────────────
          시가: $${{ steps.signal_check.outputs.open_price }}
          고가: $${{ steps.signal_check.outputs.high_price }}
          저가: $${{ steps.signal_check.outputs.low_price }}
          종가: $${{ steps.signal_check.outputs.close_price }}

          📈 기술 지표
          ─────────────────────────────────────
          RSI: ${{ steps.signal_check.outputs.current_rsi }}

          📊 현재 포지션
          ─────────────────────────────────────
          ${{ steps.signal_check.outputs.has_position == 'yes' && format('보유 상태: {0}회 물타기 (${1} 투자)', steps.signal_check.outputs.position_count, steps.signal_check.outputs.total_invested) || '보유 상태: 대기 중 (포지션 없음)' }}
          ${{ steps.signal_check.outputs.has_position == 'yes' && format('평균 매수가: ${0}', steps.signal_check.outputs.avg_price) || '' }}
          ${{ steps.signal_check.outputs.has_position == 'yes' && format('미실현 손익: {0}%', steps.signal_check.outputs.unrealized_pct) || '' }}

          📊 전략 기준 (최적화)
          ─────────────────────────────────────
          매수: RSI < ${{ steps.signal_check.outputs.rsi_buy_threshold }} → RSI >= ${{ steps.signal_check.outputs.rsi_buy_exit }}
          매도: RSI > ${{ steps.signal_check.outputs.rsi_sell_threshold }} → RSI <= ${{ steps.signal_check.outputs.rsi_sell_exit }} (수익일 때만)
          손절: 없음 (10년 승률 100%)

          🚨 시그널 & 액션
          ─────────────────────────────────────
          📡 시그널: ${{ steps.signal_check.outputs.signal_type == 'buy' && '🟢 매수 시그널 발생' || steps.signal_check.outputs.signal_type == 'sell' && '🔴 매도 시그널 발생' || '없음' }}
          🎯 액션: ${{ steps.signal_check.outputs.action_detail || (steps.signal_check.outputs.has_position == 'yes' && '홀드 (보유 중)' || '대기') }}

          ${{ steps.signal_check.outputs.action == 'buy' && '⚡ 신규 매수 실행하세요!' || '' }}
          ${{ steps.signal_check.outputs.action == 'add' && '⚡ 물타기 추가 실행하세요!' || '' }}
          ${{ steps.signal_check.outputs.action == 'sell' && '⚡ 익절 매도 실행하세요!' || '' }}
          ${{ steps.signal_check.outputs.action == 'skip' && '⏭️ 포지션 없음 - 무시' || '' }}
          ${{ steps.signal_check.outputs.action == 'hold' && '⏸️ 손실 중 - 홀드' || '' }}

          ═══════════════════════════════════════
          
          자세한 내용: https://github.com/genishk/auto-stock
